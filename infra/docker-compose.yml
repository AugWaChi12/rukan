# PostgreSQL สำหรับ dev บนเครื่องเท่านั้น — production ใช้ DigitalOcean (ดู docs/ARCHITECTURE.md)
name: stumatch

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stumatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stumatch}
      POSTGRES_DB: ${POSTGRES_DB:-stumatch_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - stumatch_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stumatch_pgdata:
