name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ค่า dummy สำหรับ build เท่านั้น — เป็นค่า public อยู่แล้ว ไม่ใช่ secret
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test build

  database:
    name: Migrations, RLS tests, types
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # รันแค่ Postgres (ไม่ต้องเปิด Supabase ทั้งชุด) แล้ว apply migrations + seed.sql
      - run: pnpm exec supabase db start

      - name: RLS / database tests (pgTAP)
        run: pnpm db:test

      - name: database.types.ts ต้องตรงกับ migrations
        run: |
          pnpm db:types
          git diff --exit-code packages/shared/src/database.types.ts \
            || (echo "::error::database.types.ts ไม่ตรงกับ schema — รัน pnpm db:types แล้ว commit" && exit 1)
