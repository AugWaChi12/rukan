name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stumatch
          POSTGRES_PASSWORD: stumatch
          POSTGRES_DB: stumatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stumatch -d stumatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ค่า dummy สำหรับ CI เท่านั้น — ไม่ใช่ secret จริง
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://stumatch:stumatch@localhost:5432/stumatch_test?schema=public
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-not-used-in-production-000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production-00
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      EXPO_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      - name: API migrations + e2e
        run: |
          pnpm --filter api prisma migrate deploy
          pnpm --filter api test:e2e
